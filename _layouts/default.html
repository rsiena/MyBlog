<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  {% if site.description %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    {{ content }}
  </main>
</body>
</html>
