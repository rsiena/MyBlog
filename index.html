---
layout: default
title: MyBlog
---
<h1>{{ site.title | escape }}</h1>
{% if site.posts.size == 0 %}
<p>No posts yet.</p>
{% else %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%B %-d, %Y" }}</time>
  </li>
  {% endfor %}
</ul>
{% endif %}
